name: Publish npm packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin an OIDC-capable npm CLI
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Verify release identity
        run: >-
          npm run release:verify --
          --tag "${{ github.event.release.tag_name }}"
          --prerelease "${{ github.event.release.prerelease }}"

      - name: Test MCP and package boundaries
        run: npm run test:mcp

      - name: Run full test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish aligned packages with provenance
        run: npm run release:publish -- --tag "${{ github.event.release.tag_name }}"
