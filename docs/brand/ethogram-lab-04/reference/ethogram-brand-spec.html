document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"b81c9b40-62aa-4e43-88bd-a0b281619015\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<style>\n  @font-face { font-family:'Archivo'; src:url(\"7788ef9e-73c3-44f9-8d8b-c8760cf708c8\") format('woff2'); font-weight:400; font-display:swap }\n  @font-face { font-family:'Archivo'; src:url(\"1fb7e714-3d8d-4341-bc35-dc6f71ccd4e4\") format('woff2'); font-weight:500; font-display:swap }\n  @font-face { font-family:'Archivo'; src:url(\"f9e132e9-21b6-4d6d-b544-376216c5f213\") format('woff2'); font-weight:600; font-display:swap }\n  @font-face { font-family:'JetBrains Mono'; src:url(\"288e603e-722a-4769-a8ab-27a1e2ab87de\") format('woff2-variations'); font-weight:100 800; font-display:swap }\n  body { margin:0; background:#F5F2EC; }\n  a { color:#0E1110; text-decoration:none; border-bottom:1px solid rgba(14,17,16,.3); }\n  a:hover { color: oklch(0.52 0.13 150); border-color: oklch(0.52 0.13 150); }\n  @keyframes egs-draw { 0% { stroke-dashoffset:400 } 60%,100% { stroke-dashoffset:0 } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#F5F2EC;color:#0E1110;font-family:Archivo,system-ui,sans-serif;padding:0 0 120px;\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:0 56px;\">\n\n    <header style=\"padding:80px 0 48px;border-bottom:2px solid #0E1110;display:grid;grid-template-columns:1fr 300px;gap:56px;align-items:end;\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:30px;\">\n          <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 64 64\" fill=\"none\" stroke=\"#0E1110\" stroke-width=\"4.4\"><path d=\"{{ master }}\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;\">ETHOGRAM · BRAND SPEC v1<\u002Fspan>\n        <\u002Fdiv>\n        <h1 style=\"font-size:56px;line-height:1.02;letter-spacing:-.035em;font-weight:600;margin:0 0 18px;max-width:760px;text-wrap:balance;\">One file. Everything needed to build in this identity.<\u002Fh1>\n        <p style=\"font-size:16.5px;line-height:1.55;color:rgba(14,17,16,.7);max-width:620px;margin:0;text-wrap:pretty;\">Written for people and for machines. Humans read the sections; agents read the JSON block at the end and the generator source next to it. Nothing here depends on an external file — no network, no font CDN, no build step.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:2;color:rgba(14,17,16,.65);border-left:1px solid rgba(14,17,16,.25);padding-left:24px;\">\n        <div>brand &nbsp;&nbsp;&nbsp;<span style=\"color:#0E1110;\">ethogram<\u002Fspan><\u002Fdiv>\n        <div>product &nbsp;<span style=\"color:#0E1110;\">behavioral testing for AI agents<\u002Fspan><\u002Fdiv>\n        <div>voice &nbsp;&nbsp;&nbsp;<span style=\"color:#0E1110;\">English, always<\u002Fspan><\u002Fdiv>\n        <div>license &nbsp;<span style=\"color:#0E1110;\">fonts under OFL 1.1<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- 01 THE MARK -->\n    <section style=\"padding:56px 0;border-bottom:1px solid rgba(14,17,16,.2);\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:32px;flex-wrap:wrap;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.16em;color:rgba(14,17,16,.45);\">01<\u002Fspan>\n        <h2 style=\"font-size:28px;font-weight:600;letter-spacing:-.022em;margin:0;\">The mark<\u002Fh2>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(14,17,16,.5);\">a behavioral profile, not a symbol of one<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:260px 1fr;gap:48px;align-items:start;\">\n        <div>\n          <svg sc-camel-view-box=\"0 0 64 64\" style=\"width:100%;height:auto;display:block;\" fill=\"none\">\n            <path d=\"M32 8L52.8 20L52.8 44L32 56L11.2 44L11.2 20Z\" stroke=\"rgba(14,17,16,.2)\" stroke-width=\"0.6\"><\u002Fpath>\n            <g stroke=\"rgba(14,17,16,.28)\" stroke-width=\"0.6\">\n              <path d=\"M32 32V8\"><\u002Fpath><path d=\"M32 32L52.8 20\"><\u002Fpath><path d=\"M32 32L52.8 44\"><\u002Fpath>\n              <path d=\"M32 32v24\"><\u002Fpath><path d=\"M32 32L11.2 44\"><\u002Fpath><path d=\"M32 32L11.2 20\"><\u002Fpath>\n            <\u002Fg>\n            <path d=\"{{ master }}\" stroke=\"#0E1110\" stroke-width=\"2.2\" stroke-dasharray=\"400\" style=\"animation:egs-draw 2.4s cubic-bezier(.65,0,.35,1) both;\"><\u002Fpath>\n            <sc-for list=\"{{ masterPts }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <circle cx=\"{{ p.x }}\" cy=\"{{ p.y }}\" r=\"1.4\" fill=\"#0E1110\"><\u002Fcircle>\n            <\u002Fsc-for>\n          <\u002Fsvg>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.9;color:rgba(14,17,16,.6);margin-top:18px;\">\n            <div>grid &nbsp;&nbsp;&nbsp;64 × 64<\u002Fdiv>\n            <div>axes &nbsp;&nbsp;&nbsp;6 at 60°, from −90°<\u002Fdiv>\n            <div>radius &nbsp;8 min · 24 max<\u002Fdiv>\n            <div>centre &nbsp;never drawn<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <p style=\"font-size:16px;line-height:1.6;color:rgba(14,17,16,.78);margin:0 0 24px;max-width:640px;text-wrap:pretty;\">Six axes of behavior, one radius per axis, one closed contour. The institutional mark carries a short third axis — policy — because the brand is itself the record of a deviation. Five long radii and one short: that reentrance is the signature, and it is what separates the mark from every star, asterisk and spark in the category.<\u002Fp>\n\n          <div style=\"border:1px solid rgba(14,17,16,.2);margin-bottom:24px;\">\n            <div style=\"display:grid;grid-template-columns:36px 1.1fr 2.4fr 56px;gap:14px;padding:10px 16px;background:rgba(14,17,16,.05);font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:rgba(14,17,16,.5);\">\n              <span>#<\u002Fspan><span>AXIS<\u002Fspan><span>MEANING<\u002Fspan><span>r<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ axes }}\" as=\"a\" hint-placeholder-count=\"6\">\n              <div style=\"display:grid;grid-template-columns:36px 1.1fr 2.4fr 56px;gap:14px;padding:10px 16px;border-top:1px solid rgba(14,17,16,.12);font-family:'JetBrains Mono',monospace;font-size:11.5px;color:rgba(14,17,16,.7);\">\n                <span style=\"color:rgba(14,17,16,.4);\">{{ a.n }}<\u002Fspan>\n                <span style=\"color:#0E1110;\">{{ a.key }}<\u002Fspan>\n                <span>{{ a.desc }}<\u002Fspan>\n                <span style=\"color:{{ a.color }};\">{{ a.r }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.8;background:#0E1110;color:#F5F2EC;padding:18px 20px;overflow-wrap:anywhere;\">\n            <div style=\"color:rgba(245,242,236,.45);font-size:10.5px;letter-spacing:.1em;margin-bottom:8px;\">PATH · viewBox 0 0 64 64<\u002Fdiv>\n            {{ master }}\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:40px;\">\n        <div style=\"border-top:2px solid #0E1110;padding-top:16px;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;margin-bottom:10px;\">NEVER FILL<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:rgba(14,17,16,.65);\">The empty interior is where the data would live. Outline only, in institutional use.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #0E1110;padding-top:16px;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;margin-bottom:10px;\">NEVER ROTATE<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:rgba(14,17,16,.65);\">Axis positions are fixed. A rotated profile is a different measurement.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #0E1110;padding-top:16px;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;margin-bottom:10px;\">NEVER ROUND<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:rgba(14,17,16,.65);\">No <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;\">stroke-linejoin: round<\u002Fspan>. Measurement has corners.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid #0E1110;padding-top:16px;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;margin-bottom:10px;\">NEVER DISTORT<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:rgba(14,17,16,.65);\">Uniform scale only. Proportion is the measurement itself.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 02 GENERATIVE -->\n    <section style=\"padding:56px 0;border-bottom:1px solid rgba(14,17,16,.2);\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:16px;flex-wrap:wrap;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.16em;color:rgba(14,17,16,.45);\">02<\u002Fspan>\n        <h2 style=\"font-size:28px;font-weight:600;letter-spacing:-.022em;margin:0;\">The generative system<\u002Fh2>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(14,17,16,.5);\">one profile per story, drawn by the tool itself<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size:16px;line-height:1.6;color:rgba(14,17,16,.72);max-width:720px;margin:0 0 32px;text-wrap:pretty;\">The institutional mark is fixed. Everything else is generated: each story, agent or run produces its own polygon from its own result. A failing axis collapses to the minimum radius. Green when behavior held, coral on the axis that diverged — colour only where colour carries state.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:rgba(14,17,16,.2);border:1px solid rgba(14,17,16,.2);\">\n        <sc-for list=\"{{ profiles }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div style=\"background:#F5F2EC;padding:20px 16px;display:flex;flex-direction:column;gap:14px;min-width:0;\">\n            <svg sc-camel-view-box=\"0 0 64 64\" style=\"width:100%;height:auto;display:block;\" fill=\"none\"><path d=\"{{ p.d }}\" stroke=\"{{ p.color }}\" stroke-width=\"3\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.7;color:rgba(14,17,16,.6);overflow-wrap:anywhere;\">\n              <div style=\"color:#0E1110;\">{{ p.name }}<\u002Fdiv>\n              <div>{{ p.state }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 03 COLOR -->\n    <section style=\"padding:56px 0;border-bottom:1px solid rgba(14,17,16,.2);\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:32px;flex-wrap:wrap;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.16em;color:rgba(14,17,16,.45);\">03<\u002Fspan>\n        <h2 style=\"font-size:28px;font-weight:600;letter-spacing:-.022em;margin:0;\">Colour<\u002Fh2>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(14,17,16,.5);\">two brand colours, two state colours<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(14,17,16,.2);border:1px solid rgba(14,17,16,.2);\">\n        <sc-for list=\"{{ colors }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"background:#F5F2EC;min-width:0;\">\n            <div style=\"height:96px;background:{{ c.value }};border-bottom:1px solid rgba(14,17,16,.12);\"><\u002Fdiv>\n            <div style=\"padding:18px 20px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.85;color:rgba(14,17,16,.6);overflow-wrap:anywhere;\">\n              <div style=\"color:#0E1110;letter-spacing:.06em;\">{{ c.name }}<\u002Fdiv>\n              <div>{{ c.value }}<\u002Fdiv>\n              <div>{{ c.hex }}<\u002Fdiv>\n              <div style=\"margin-top:6px;\">{{ c.use }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:15px;line-height:1.6;color:rgba(14,17,16,.7);max-width:720px;margin-top:24px;\">Carbon and ivory carry the brand. Moss and coral are never decoration: moss means a behavior held, coral means an axis diverged. The institutional mark is monochrome — a coloured logo is a status indicator, and status belongs to generated profiles, not to the identity.<\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 04 TYPE -->\n    <section style=\"padding:56px 0;border-bottom:1px solid rgba(14,17,16,.2);\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:32px;flex-wrap:wrap;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.16em;color:rgba(14,17,16,.45);\">04<\u002Fspan>\n        <h2 style=\"font-size:28px;font-weight:600;letter-spacing:-.022em;margin:0;\">Type<\u002Fh2>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(14,17,16,.5);\">sans asserts · mono proves<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:48px;\">\n        <div>\n          <div style=\"font-size:44px;font-weight:600;letter-spacing:-.035em;line-height:1.04;margin-bottom:8px;\">Behavior that holds<\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(14,17,16,.5);margin-bottom:28px;\">Archivo 600 · −.035em · assertion<\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;line-height:2;color:rgba(14,17,16,.75);\">\n            <div>FAIL &nbsp;pii_redaction &nbsp;3.1s<\u002Fdiv>\n            <div>&nbsp;&nbsp;expected &nbsp;redact_pii before emit<\u002Fdiv>\n            <div>&nbsp;&nbsp;observed &nbsp;—<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(14,17,16,.5);margin-top:12px;\">JetBrains Mono · evidence<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"border:1px solid rgba(14,17,16,.2);\">\n            <div style=\"display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:14px;padding:10px 16px;background:rgba(14,17,16,.05);font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:rgba(14,17,16,.5);\">\n              <span>SIZE<\u002Fspan><span>TRACKING<\u002Fspan><span>ROLE<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ typeScale }}\" as=\"t\" hint-placeholder-count=\"6\">\n              <div style=\"display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:14px;padding:9px 16px;border-top:1px solid rgba(14,17,16,.12);font-family:'JetBrains Mono',monospace;font-size:11.5px;color:rgba(14,17,16,.7);\">\n                <span style=\"color:#0E1110;\">{{ t.size }}<\u002Fspan><span>{{ t.tracking }}<\u002Fspan><span>{{ t.role }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.9;color:rgba(14,17,16,.65);margin-top:20px;\">\n            <div>weights &nbsp;&nbsp;&nbsp;<span style=\"color:#0E1110;\">400 · 500 · 600 only<\u002Fspan><\u002Fdiv>\n            <div>emphasis &nbsp;<span style=\"color:#0E1110;\">weight 600 or switch to mono<\u002Fspan><\u002Fdiv>\n            <div>italic &nbsp;&nbsp;&nbsp;&nbsp;<span style=\"color:#0E1110;\">never (no real italic in Archivo)<\u002Fspan><\u002Fdiv>\n            <div>numbers &nbsp;&nbsp;<span style=\"color:#0E1110;\">comparable → mono, tabular-nums<\u002Fspan><\u002Fdiv>\n            <div>measure &nbsp;&nbsp;<span style=\"color:#0E1110;\">34–62ch · balance titles, pretty prose<\u002Fspan><\u002Fdiv>\n            <div>serif &nbsp;&nbsp;&nbsp;&nbsp;<span style=\"color:#0E1110;\">Instrument Serif, covers and essays only<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 05 MOTION -->\n    <section style=\"padding:56px 0;border-bottom:1px solid rgba(14,17,16,.2);\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:32px;flex-wrap:wrap;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.16em;color:rgba(14,17,16,.45);\">05<\u002Fspan>\n        <h2 style=\"font-size:28px;font-weight:600;letter-spacing:-.022em;margin:0;\">Motion<\u002Fh2>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(14,17,16,.5);\">three durations, two easings, no bounce<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:32px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:2;color:rgba(14,17,16,.7);border-left:1px solid rgba(14,17,16,.25);padding-left:22px;\">\n          <div style=\"color:#0E1110;letter-spacing:.1em;font-size:10.5px;margin-bottom:8px;\">DURATIONS<\u002Fdiv>\n          <div>micro &nbsp;&nbsp;&nbsp;&nbsp;180ms<\u002Fdiv>\n          <div>entrance &nbsp;900ms<\u002Fdiv>\n          <div>ambient &nbsp;&nbsp;3400ms<\u002Fdiv>\n          <div style=\"color:rgba(14,17,16,.5);margin-top:8px;\">nothing between 1s and 3s<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:2;color:rgba(14,17,16,.7);border-left:1px solid rgba(14,17,16,.25);padding-left:22px;\">\n          <div style=\"color:#0E1110;letter-spacing:.1em;font-size:10.5px;margin-bottom:8px;\">EASINGS<\u002Fdiv>\n          <div>entrance &nbsp;cubic-bezier(.2,.8,.2,1)<\u002Fdiv>\n          <div>ambient &nbsp;&nbsp;linear<\u002Fdiv>\n          <div style=\"color:rgba(14,17,16,.5);margin-top:8px;\">no elastic, no overshoot, no spring<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:2;color:rgba(14,17,16,.7);border-left:1px solid rgba(14,17,16,.25);padding-left:22px;\">\n          <div style=\"color:#0E1110;letter-spacing:.1em;font-size:10.5px;margin-bottom:8px;\">ORIGIN<\u002Fdiv>\n          <div>from the profile centre<\u002Fdiv>\n          <div>or from the left (time axis)<\u002Fdiv>\n          <div style=\"color:rgba(14,17,16,.5);margin-top:8px;\">never from the bottom<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:15px;line-height:1.65;color:rgba(14,17,16,.72);max-width:760px;margin-top:28px;\">Approved patterns: contour draws itself on entrance; a single axis collapses and returns to signal divergence; a scan sweeps across a field; the divergent edge pulses alone — never the whole mark; a segment runs along the contour as the loading state, replacing any circular spinner. Feedback is text, not animation. Nothing floats over content.<\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 06 INTERFACE -->\n    <section style=\"padding:56px 0;border-bottom:1px solid rgba(14,17,16,.2);\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:32px;flex-wrap:wrap;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.16em;color:rgba(14,17,16,.45);\">06<\u002Fspan>\n        <h2 style=\"font-size:28px;font-weight:600;letter-spacing:-.022em;margin:0;\">Interface<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:40px;\">\n        <div style=\"font-size:15px;line-height:1.7;color:rgba(14,17,16,.75);\">\n          <p style=\"margin:0 0 14px;\"><strong style=\"font-weight:600;\">No radius anywhere.<\u002Fstrong> Square corners on buttons, inputs, cards, badges and avatars. The only exception is a browser's own chrome.<\u002Fp>\n          <p style=\"margin:0 0 14px;\"><strong style=\"font-weight:600;\">Groups divide by 1px,<\u002Fstrong> never by gap. Segmented controls, tables and card grids share hairline borders.<\u002Fp>\n          <p style=\"margin:0;\"><strong style=\"font-weight:600;\">Focus is a 2px moss outline<\u002Fstrong> with 2px offset, always visible. No glow, no shadow — the system has no shadows at all.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.7;color:rgba(14,17,16,.75);\">\n          <p style=\"margin:0 0 14px;\"><strong style=\"font-weight:600;\">One primary button per screen,<\u002Fstrong> ivory on carbon or carbon on ivory. Secondary is an outline whose border brightens on hover; the fill never appears. Coral only for irreversible actions.<\u002Fp>\n          <p style=\"margin:0 0 14px;\"><strong style=\"font-weight:600;\">Minimum target 36px<\u002Fstrong> on desktop, 44px on touch.<\u002Fp>\n          <p style=\"margin:0;\"><strong style=\"font-weight:600;\">Expansion does not animate height.<\u002Fstrong> Content enters in 180ms; animated height lies about what is there.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 07 APERTURE -->\n    <section style=\"padding:56px 0;border-bottom:1px solid rgba(14,17,16,.2);\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:32px;flex-wrap:wrap;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.16em;color:rgba(14,17,16,.45);\">07<\u002Fspan>\n        <h2 style=\"font-size:28px;font-weight:600;letter-spacing:-.022em;margin:0;\">Aperture<\u002Fh2>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(14,17,16,.5);\">the mark as a window<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:200px 1fr;gap:48px;align-items:start;\">\n        <div style=\"position:relative;width:200px;height:200px;\">\n          <div style=\"position:absolute;inset:0;clip-path:{{ clipMaster }};background:#0E1110;background-image:radial-gradient(circle at 1px 1px, rgba(245,242,236,.5) 1px, transparent 1.4px);background-size:6px 6px;\"><\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 64 64\" style=\"position:absolute;inset:0;width:100%;height:100%;\" fill=\"none\"><path d=\"{{ master }}\" stroke=\"rgba(14,17,16,.8)\" stroke-width=\"1\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.7;color:rgba(14,17,16,.75);max-width:640px;\">\n          <p style=\"margin:0 0 14px;\">The polygon can frame instead of draw: a window onto a photograph, a trajectory, an execution matrix, a log. Use it for agent avatars, section covers and editorial triptychs.<\u002Fp>\n          <p style=\"margin:0 0 14px;\"><strong style=\"font-weight:600;\">The contour stays drawn on top,<\u002Fstrong> always. A clip without a stroke stops being the mark and becomes an arbitrary mask.<\u002Fp>\n          <p style=\"margin:0;\"><strong style=\"font-weight:600;\">Nothing lives inside below 80px.<\u002Fstrong> The silhouette needs its emptiness to be recognised — under that size, the mark is only a mark.<\u002Fp>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.8;background:#0E1110;color:#F5F2EC;padding:16px 18px;margin-top:20px;overflow-wrap:anywhere;\">\n            <div style=\"color:rgba(245,242,236,.45);font-size:10.5px;letter-spacing:.1em;margin-bottom:8px;\">CSS CLIP-PATH<\u002Fdiv>\n            {{ clipMaster }}\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 08 SCALE -->\n    <section style=\"padding:56px 0;border-bottom:1px solid rgba(14,17,16,.2);\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:32px;flex-wrap:wrap;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.16em;color:rgba(14,17,16,.45);\">08<\u002Fspan>\n        <h2 style=\"font-size:28px;font-weight:600;letter-spacing:-.022em;margin:0;\">Scale, stroke, favicon<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:44px;flex-wrap:wrap;padding-bottom:36px;\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;\">\n          <svg width=\"112\" height=\"112\" sc-camel-view-box=\"0 0 64 64\" fill=\"none\" stroke=\"#0E1110\" stroke-width=\"3\"><path d=\"{{ master }}\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(14,17,16,.5);\">≥64 · 3<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;\">\n          <svg width=\"48\" height=\"48\" sc-camel-view-box=\"0 0 64 64\" fill=\"none\" stroke=\"#0E1110\" stroke-width=\"4\"><path d=\"{{ master }}\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(14,17,16,.5);\">48 · 4<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;\">\n          <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 64 64\" fill=\"none\" stroke=\"#0E1110\" stroke-width=\"4.8\"><path d=\"{{ master }}\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(14,17,16,.5);\">24 · 4.8<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 64 64\" fill=\"none\" stroke=\"#0E1110\" stroke-width=\"5.5\"><path d=\"{{ master }}\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(14,17,16,.5);\">16 · 5.5<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:14.5px;line-height:1.6;color:rgba(14,17,16,.65);max-width:340px;\">Stroke thickens as the mark shrinks. Absolute minimum 16px; below that use the wordmark. On dark backgrounds reduce stroke by 0.5 to compensate for optical spread.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.9;background:#0E1110;color:#F5F2EC;padding:20px;overflow-wrap:anywhere;\">\n        <div style=\"color:rgba(245,242,236,.45);font-size:10.5px;letter-spacing:.1em;margin-bottom:10px;\">FAVICON · ONE FILE, BOTH THEMES<\u002Fdiv>\n        {{ faviconSrc }}\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- 09 MACHINE READABLE -->\n    <section style=\"padding:56px 0 0;\">\n      <div style=\"display:flex;align-items:baseline;gap:20px;margin-bottom:16px;flex-wrap:wrap;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.16em;color:rgba(14,17,16,.45);\">09<\u002Fspan>\n        <h2 style=\"font-size:28px;font-weight:600;letter-spacing:-.022em;margin:0;\">For machines<\u002Fh2>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(14,17,16,.5);\">tokens and generator · copy and hand to any system<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size:15.5px;line-height:1.6;color:rgba(14,17,16,.7);max-width:720px;margin:0 0 28px;\">Agents: read the JSON below as the authoritative token set, and the module beside it to draw any profile. Both are complete on their own — an implementation needs nothing else from this document.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;\">\n        <div style=\"border:1px solid rgba(14,17,16,.2);min-width:0;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid rgba(14,17,16,.15);background:rgba(14,17,16,.04);\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:rgba(14,17,16,.55);\">ethogram.tokens.json<\u002Fspan>\n            <button sc-camel-on-click=\"{{ copyJson }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px;background:transparent;border:1px solid rgba(14,17,16,.3);padding:5px 10px;cursor:pointer;color:#0E1110;transition:border-color .18s;\" style-hover=\"border-color:#0E1110\">{{ jsonLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <pre id=\"ethogram-spec-json\" style=\"margin:0;padding:18px;font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.75;color:rgba(14,17,16,.8);max-height:440px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;\">{{ specJson }}<\u002Fpre>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid rgba(14,17,16,.2);min-width:0;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid rgba(14,17,16,.15);background:rgba(14,17,16,.04);\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:rgba(14,17,16,.55);\">ethogram-mark.js · ESM<\u002Fspan>\n            <button sc-camel-on-click=\"{{ copyJs }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px;background:transparent;border:1px solid rgba(14,17,16,.3);padding:5px 10px;cursor:pointer;color:#0E1110;transition:border-color .18s;\" style-hover=\"border-color:#0E1110\">{{ jsLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <pre id=\"ethogram-mark-source\" style=\"margin:0;padding:18px;font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.75;color:rgba(14,17,16,.8);max-height:440px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;\">{{ generatorSrc }}<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:36px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.9;color:rgba(14,17,16,.65);\">\n        <div><span style=\"color:#0E1110;\">how to use this file<\u002Fspan> · attach it to a conversation, host it as a URL, or commit it to the repository root. It is self-contained.<\u002Fdiv>\n        <div><span style=\"color:#0E1110;\">what it deliberately omits<\u002Fspan> · the exploration behind the decisions. Those live in the labs; this is only what was settled.<\u002Fdiv>\n        <div><span style=\"color:#0E1110;\">fonts<\u002Fspan> · Archivo, JetBrains Mono and Instrument Serif, all SIL OFL 1.1 — free to embed and redistribute with the license file.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1290}}\">\nclass Component extends DCLogic {\n  state = { copiedJson: false, copiedJs: false };\n  componentWillUnmount() { clearTimeout(this._a); clearTimeout(this._b); }\n\n  renderVals() {\n    const A = [-90, -30, 30, 90, 150, 210].map(d => d * Math.PI / 180);\n    const pt = (r, i) => ({\n      x: Math.round((32 + r * Math.cos(A[i])) * 10) / 10,\n      y: Math.round((32 + r * Math.sin(A[i])) * 10) / 10\n    });\n    const poly = (radii) => radii.map((r, i) => {\n      const p = pt(r, i);\n      return (i ? 'L' : 'M') + p.x + ' ' + p.y;\n    }).join('') + 'Z';\n    const clipOf = (radii) => 'polygon(' + radii.map((r, i) => {\n      const p = pt(r, i);\n      return (p.x / 64 * 100).toFixed(2) + '% ' + (p.y / 64 * 100).toFixed(2) + '%';\n    }).join(', ') + ')';\n\n    const MASTER = [22, 20, 9, 19, 16, 21];\n    const master = poly(MASTER);\n    const CARBON = '#0E1110', IVORY = '#F5F2EC';\n    const MOSS = 'oklch(0.76 0.16 150)', CORAL = 'oklch(0.76 0.16 30)';\n    const MOSS_HEX = '#5FBF8B', CORAL_HEX = '#E58C72';\n\n    const AXES = [\n      { key: 'sequence', desc: 'step order held' },\n      { key: 'tools', desc: 'expected calls occurred' },\n      { key: 'policy', desc: 'mandatory rules applied' },\n      { key: 'grounding', desc: 'answer supported by evidence' },\n      { key: 'tone', desc: 'agreed register respected' },\n      { key: 'cost', desc: 'steps and latency within budget' }\n    ];\n    const axes = AXES.map((a, i) => ({\n      n: '0' + (i + 1), key: a.key, desc: a.desc, r: MASTER[i],\n      color: MASTER[i] < 12 ? 'oklch(0.52 0.18 30)' : 'rgba(14,17,16,.7)'\n    }));\n\n    const profiles = [\n      { name: 'institutional', state: 'fixed profile', radii: MASTER, color: CARBON },\n      { name: 'refund_policy', state: 'pass · 24 runs', radii: [22, 21, 20, 22, 19, 21], color: 'oklch(0.58 0.15 150)' },\n      { name: 'escalation_path', state: 'pass · thin margin', radii: [20, 18, 17, 21, 14, 16], color: 'oklch(0.58 0.15 150)' },\n      { name: 'pii_redaction', state: 'fail · policy', radii: [21, 19, 8, 20, 17, 18], color: 'oklch(0.55 0.18 30)' },\n      { name: 'tool_order', state: 'fail · sequence', radii: [9, 18, 19, 17, 16, 20], color: 'oklch(0.55 0.18 30)' },\n      { name: 'cost_ceiling', state: 'fail · cost', radii: [19, 20, 18, 19, 17, 9], color: 'oklch(0.55 0.18 30)' }\n    ].map(p => ({ name: p.name, state: p.state, color: p.color, d: poly(p.radii) }));\n\n    const colors = [\n      { name: 'CARBON', value: CARBON, hex: 'oklch(0.19 0.007 165)', use: 'primary background' },\n      { name: 'IVORY', value: IVORY, hex: 'oklch(0.95 0.012 85)', use: 'primary foreground' },\n      { name: 'MOSS', value: MOSS, hex: MOSS_HEX, use: 'state: pass, active, focus' },\n      { name: 'CORAL', value: CORAL, hex: CORAL_HEX, use: 'state: fail, destructive' }\n    ];\n\n    const typeScale = [\n      { size: '72px', tracking: '−.04em', role: 'display' },\n      { size: '40px', tracking: '−.032em', role: 'section head' },\n      { size: '24px', tracking: '−.025em', role: 'lead' },\n      { size: '17px', tracking: '−.005em', role: 'prose' },\n      { size: '12.5px', tracking: '0', role: 'mono evidence' },\n      { size: '11px', tracking: '+.16em', role: 'mono caps label' }\n    ];\n\n    const faviconSrc = '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" fill=\"none\" stroke-width=\"5.5\"><style>path{stroke:' + CARBON + '}@media(prefers-color-scheme:dark){path{stroke:' + IVORY + '}}<\u002Fstyle><path d=\"' + master + '\"/><\u002Fsvg>';\n\n    const spec = {\n      brand: 'ethogram',\n      version: 1,\n      voice: 'English',\n      mark: {\n        grid: 64,\n        axes: AXES.map(a => a.key),\n        axisAngles: [-90, -30, 30, 90, 150, 210],\n        radius: { min: 8, max: 24 },\n        institutionalRadii: MASTER,\n        path: master,\n        clipPath: clipOf(MASTER),\n        strokeBySize: { '16': 5.5, '24': 4.8, '48': 4, '64+': 3 },\n        minSize: 16,\n        rules: ['never fill', 'never rotate', 'never round joins', 'never distort', 'monochrome when institutional', 'contour stays drawn over any clip', 'nothing inside below 80px']\n      },\n      color: {\n        carbon: CARBON, ivory: IVORY, moss: MOSS, coral: CORAL,\n        mossHex: MOSS_HEX, coralHex: CORAL_HEX,\n        rule: 'moss and coral only carry state, never decoration'\n      },\n      type: {\n        sans: { family: 'Archivo', weights: [400, 500, 600], role: 'assertion' },\n        mono: { family: 'JetBrains Mono', role: 'evidence, numbers, labels' },\n        serif: { family: 'Instrument Serif', role: 'covers and essays only' },\n        scale: typeScale,\n        rules: ['negative tracking grows with size, zero at 14px', 'emphasis is weight 600 or a switch to mono', 'no italic', 'comparable numbers use mono tabular-nums', 'measure 34-62ch', 'balance titles, pretty prose']\n      },\n      motion: {\n        durations: { micro: 180, entrance: 900, ambient: 3400 },\n        easings: { entrance: 'cubic-bezier(.2,.8,.2,1)', ambient: 'linear' },\n        origin: ['profile centre', 'left (time axis)'],\n        forbidden: ['bounce', 'elastic', 'spring', 'overshoot', 'animated height', 'motion from the bottom'],\n        patterns: ['contour draws on entrance', 'single axis collapses to signal divergence', 'scan sweep across a field', 'divergent edge pulses alone', 'segment running along the contour as loading']\n      },\n      interface: {\n        radius: 0,\n        shadows: 'none',\n        focus: '2px moss outline, 2px offset',\n        groupDivider: '1px hairline, never gap',\n        minTarget: { desktop: 36, touch: 44 },\n        primaryPerScreen: 1,\n        rules: ['feedback is text, not animation', 'nothing floats over content', 'coral only for irreversible actions', 'expansion does not animate height']\n      },\n      assets: {\n        'favicon.svg': 'auto light/dark, ~300B',\n        'mark.svg': 'currentColor stroke',\n        'sprite.svg': '#eg-mark, #eg-mark-micro, #eg-wide, #eg-pass, #eg-fail',\n        'ethogram-mark.js': 'generator: markPath, markClip, profileFromScores, strokeFor',\n        'fonts.css': 'self-hosted @font-face + CSS variables'\n      }\n    };\n    const specJson = JSON.stringify(spec, null, 2);\n\n    const generatorSrc = [\n      '// ethogram — generative mark. No dependencies.',\n      'export const AXES = ' + JSON.stringify(AXES.map(a => a.key)) + ';',\n      'export const ANGLES = [-90,-30,30,90,150,210].map(d => d * Math.PI / 180);',\n      'export const MASTER = [' + MASTER.join(',') + ']; // policy axis collapsed',\n      '',\n      'export function point(r, i) {',\n      '  return [',\n      '    Math.round((32 + r * Math.cos(ANGLES[i])) * 10) / 10,',\n      '    Math.round((32 + r * Math.sin(ANGLES[i])) * 10) / 10',\n      '  ];',\n      '}',\n      '',\n      '/** radii: six numbers 8-24 -> SVG path on a 0 0 64 64 viewBox */',\n      'export function markPath(radii = MASTER) {',\n      '  return radii.map((r, i) => {',\n      '    const [x, y] = point(Math.max(8, Math.min(24, r)), i);',\n      \"    return (i ? 'L' : 'M') + x + ' ' + y;\",\n      \"  }).join('') + 'Z';\",\n      '}',\n      '',\n      '/** same shape as a CSS clip-path polygon(), for framing images */',\n      'export function markClip(radii = MASTER) {',\n      \"  return 'polygon(' + radii.map((r, i) => {\",\n      '    const [x, y] = point(Math.max(8, Math.min(24, r)), i);',\n      \"    return (x / 64 * 100).toFixed(2) + '% ' + (y / 64 * 100).toFixed(2) + '%';\",\n      \"  }).join(', ') + ')';\",\n      '}',\n      '',\n      '/** scores: { sequence: 0..1, tools, policy, grounding, tone, cost } */',\n      'export function profileFromScores(scores) {',\n      '  return AXES.map(k => {',\n      \"    const v = typeof scores[k] === 'number' ? scores[k] : 1;\",\n      '    return v < 0.5 ? 8 : 8 + Math.round(v * 16);',\n      '  });',\n      '}',\n      '',\n      '/** optical stroke width for a rendered size, in 64-unit space */',\n      'export function strokeFor(px) {',\n      '  if (px <= 16) return 5.5;',\n      '  if (px <= 24) return 4.8;',\n      '  if (px <= 48) return 4;',\n      '  return 3;',\n      '}'\n    ].join('\\n');\n\n    const write = (text, key, timer) => {\n      try { navigator.clipboard && navigator.clipboard.writeText(text); } catch (e) {}\n      this.setState({ [key]: true });\n      clearTimeout(this[timer]);\n      this[timer] = setTimeout(() => this.setState({ [key]: false }), 1800);\n    };\n\n    return {\n      master, masterPts: MASTER.map((r, i) => pt(r, i)), clipMaster: clipOf(MASTER),\n      axes, profiles, colors, typeScale, faviconSrc, specJson, generatorSrc,\n      jsonLabel: this.state.copiedJson ? 'copied' : 'copy',\n      jsLabel: this.state.copiedJs ? 'copied' : 'copy',\n      copyJson: () => write(specJson, 'copiedJson', '_a'),\n      copyJs: () => write(generatorSrc, 'copiedJs', '_b')\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
