<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
  <title id="title">Ethogram — three logo concepts</title>
  <desc id="desc">Professional comparison board showing State Fold, Evidence Kernel and Invariant Shift logo concepts.</desc>
  <rect width="1600" height="1280" fill="#0B0C0C"/>

  <text x="96" y="104" fill="#F3F0E8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="48" font-weight="600" letter-spacing="-1.5">Ethogram</text>
  <text x="96" y="145" fill="#858780" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="1.2">LOGO EXPLORATION / 01</text>
  <line x1="96" y1="184" x2="1504" y2="184" stroke="#343632"/>

