    <line x1="1036" y1="42" x2="1036" y2="230" stroke="#D7D4CC"/>
    <g transform="translate(1084 70) scale(.82)">
      <rect width="188" height="188" fill="#0B0C0C"/><path d="M0 44H47C75 44 80 64 108 64H188V88H108C73 88 68 68 43 68H0Z" fill="#F3F0E8"/><path d="M0 144H43C68 144 73 124 108 124H188V148H108C80 148 75 168 47 168H0Z" fill="#F3F0E8"/>
