  <text x="96" y="1186" fill="#F3F0E8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">Different paths. Same critical behavior.</text>
  <text x="1504" y="1186" fill="#777972" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" letter-spacing=".8">BLACK / IVORY · VECTOR STUDY</text>
