    <text x="268" y="177" fill="#0B0C0C" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="88" font-weight="600" letter-spacing="-3.4">Ethogram</text>
    <line x1="1036" y1="42" x2="1036" y2="230" stroke="#D7D4CC"/>
