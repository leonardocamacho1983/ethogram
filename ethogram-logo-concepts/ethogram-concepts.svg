    <text x="42" y="48" fill="#767870" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="1.4">01 / STATE FOLD</text>
    <g transform="translate(52 74)" fill="none" stroke="#0B0C0C" stroke-width="28" stroke-linecap="square" stroke-linejoin="round">
